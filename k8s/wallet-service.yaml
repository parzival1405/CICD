apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://postgres:5432/wallet
  DB_USERNAME: wallet
  WALLET_MAXDEPOSIT: "5000000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  labels:
    app: wallet-service
spec:
  replicas: 2
  # Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 7: rolling update không downtime,
  # giữ 5 ReplicaSet cũ để rollback, quá 5 phút không tiến triển -> ProgressDeadlineExceeded
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      imagePullSecrets:          # ← thêm đoạn này
        - name: ghcr-pull-server-kubenetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 7:
      # >= preStop 5s + graceful shutdown của app 8s
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/parzival1405/wallet-service:TAG_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wallet-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 7:
          # chờ 5s cho Service/Ingress gỡ Pod khỏi endpoint rồi mới gửi SIGTERM -> không rớt request
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
spec:
  selector:
    app: wallet-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallet-service
spec:
  ingressClassName: nginx
  rules:
    - host: wallet-dev.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallet-service
                port:
                  name: http
---
# Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 7:
# drain node không bao giờ làm còn 0 Pod wallet-service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wallet-service
