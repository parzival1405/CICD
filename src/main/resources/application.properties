spring.application.name=wallet-service
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
info.app.name=@project.artifactId@
info.app.version=@project.version@

# Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 10 Giai đoạn 1: hạn mức nạp mỗi lần (WALLET_MAXDEPOSIT)
wallet.max-deposit=50000000

# Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 03 Giai đoạn 3: datasource lấy từ biến môi trường
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wallet}
spring.datasource.username=${DB_USERNAME:wallet}
spring.datasource.password=${DB_PASSWORD:}
# Sửa code Bước 1 - mục 6 "Thực hành từng bước", Bài 03 Giai đoạn 4: schema do Flyway tạo,
# Hibernate chỉ kiểm tra entity khớp bảng (sai thì app không khởi động)
spring.jpa.hibernate.ddl-auto=validate
# DB đã có bảng do Hibernate tạo từ trước (chưa có lịch sử Flyway) -> đánh dấu là đang ở V1, không chạy lại V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false