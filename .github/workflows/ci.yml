name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Bỏ qua job nặng (build, sca, docker) khi PR/push chỉ đổi file không ảnh hưởng ứng dụng.
  # Lọc ở cấp job, KHÔNG dùng paths-ignore ở `on:`: workflow luôn chạy nên required checks luôn được báo về,
  # job bị skip bằng `if:` được tính là đạt -> PR không bị kẹt "Waiting for status to be reported".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lấy danh sách file của PR qua API
    outputs:
      # An toàn khi nghi ngờ: bước lọc bị bỏ qua (tag v*, chạy tay) hoặc lỗi -> true -> chạy đủ
      code: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # every: file chỉ tính là "code" khi khớp TẤT CẢ mẫu = nằm ngoài mọi vùng được phép bỏ qua.
          # Chỉ liệt kê vùng ĐƯỢC BỎ QUA; file ở chỗ khác (kể cả thư mục mới) -> code=true -> chạy đủ.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!k8s/**'
              - '!deploy/**'
              - '!docs/**'
              - '!**/*.md'

  sca:
    name: SCA (Trivy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sửa code Bước 2 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 6: áp dụng ngoại lệ có hạn (.trivyignore.yaml)
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1 fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore.yaml --exit-code 1 /src

  build:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=${{ vars.SONAR_ORG }} \
              -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
              -Dsonar.qualitygate.wait=true
          else
            echo "Khong co SONAR_TOKEN (vi du PR tu fork) - chi build va test"
            ./mvnw -B -ntp verify
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      # Thêm code Bước 2 - mục 6 "Thực hành từng bước", Bài 03 Giai đoạn 6: lưu SBOM CycloneDX của ứng dụng
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: target/classes/META-INF/sbom/application.cdx.json
          retention-days: 30

  # Thêm code Bước 3 - mục 6 "Thực hành từng bước", Bài 03 Giai đoạn 6: quét secret bằng Gitleaks.
  # gitleaks-action: PR/push chỉ quét các commit mới; workflow_dispatch quét toàn bộ lịch sử.
  # Không phụ thuộc job changes: LUÔN chạy (rẻ, và k8s/ là nơi dễ lỡ commit Secret thật).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # action gọi API liệt kê commit của PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    # Sửa code Bước 1 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 6: image chỉ build/push khi mọi gate xanh
    # -> deploy-staging (needs: docker) gián tiếp phụ thuộc build, sca, secrets.
    # build/sca bị skip (chỉ đổi k8s/, docs/, *.md) -> docker và các job deploy tự skip theo.
    needs: [build, sca, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Action bên thứ ba ghim theo commit SHA (tag có thể bị dời sang code khác) - SonarQube rule githubactions:S7637
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wallet-service
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Sửa code Bước 2 - mục 6 "Thực hành từng bước", Bài 03 Giai đoạn 6: build -> scan -> push,
      # image có CVE HIGH/CRITICAL đã có bản vá thì không bao giờ được push
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: wallet-service:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sửa code Bước 2 - mục 6 "Thực hành từng bước", Bài 05 Giai đoạn 6: quét image dùng chung file ngoại lệ với job sca
      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore.yaml --exit-code 1 wallet-service:scan

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

  deploy-staging:
    name: Deploy staging
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wsl-lab]
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            scripts

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"
          echo "REMOTE=${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload deploy files
        run: scp $SSH_OPTS deploy/compose.yaml deploy/deploy.sh deploy/rollback.sh "$REMOTE:/opt/wallet/staging/"

      - name: Deploy
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/staging/deploy.sh '$IMAGE_TAG'"

      - name: Smoke test
        id: smoke
        run: ./scripts/smoke-test.sh "${{ vars.APP_URL }}"

      - name: Rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/staging/rollback.sh"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wsl-lab]
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            scripts

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"
          echo "REMOTE=${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload deploy files
        run: scp $SSH_OPTS deploy/compose.bluegreen.yaml deploy/bluegreen.sh "$REMOTE:/opt/wallet/production/"

      - name: Stage on idle color
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh stage '$IMAGE_TAG'"

      - name: Smoke test preview
        id: smoke_preview
        run: |
          ACTIVE=$(ssh $SSH_OPTS "$REMOTE" "cat /opt/wallet/production/active_color 2>/dev/null || echo none")
          if [[ "$ACTIVE" == "blue" ]]; then PORT=8092; else PORT=8091; fi
          ./scripts/smoke-test.sh "http://localhost:$PORT"

      - name: Abort on preview failure
        if: failure() && steps.smoke_preview.outcome == 'failure'
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh abort"

      - name: Switch traffic
        id: switch
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh switch"

      - name: Smoke test production
        id: smoke_prod
        run: ./scripts/smoke-test.sh "${{ vars.APP_URL }}"

      - name: Roll back traffic
        if: failure() && steps.smoke_prod.outcome == 'failure'
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh switch"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production"
            echo "- Image: \`$IMAGE_TAG\`"
            echo "- Duyệt bởi: xem tab Environments → production"
            echo '```'
            ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh status" 2>&1 | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
