name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wallet-service
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wsl-lab]
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            scripts

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"
          echo "REMOTE=${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload deploy files
        run: scp $SSH_OPTS deploy/compose.yaml deploy/deploy.sh deploy/rollback.sh "$REMOTE:/opt/wallet/staging/"

      - name: Deploy
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/staging/deploy.sh '$IMAGE_TAG'"

      - name: Smoke test
        id: smoke
        run: ./scripts/smoke-test.sh "${{ vars.APP_URL }}"

      - name: Rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/staging/rollback.sh"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wsl-lab]
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            scripts

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"
          echo "REMOTE=${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload deploy files
        run: scp $SSH_OPTS deploy/compose.bluegreen.yaml deploy/bluegreen.sh "$REMOTE:/opt/wallet/production/"

      - name: Stage on idle color
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh stage '$IMAGE_TAG'"

      - name: Smoke test preview
        id: smoke_preview
        run: |
          ACTIVE=$(ssh $SSH_OPTS "$REMOTE" "cat /opt/wallet/production/active_color 2>/dev/null || echo none")
          if [[ "$ACTIVE" == "blue" ]]; then PORT=8092; else PORT=8091; fi
          ./scripts/smoke-test.sh "http://localhost:$PORT"

      - name: Abort on preview failure
        if: failure() && steps.smoke_preview.outcome == 'failure'
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh abort"

      - name: Switch traffic
        id: switch
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh switch"

      - name: Smoke test production
        id: smoke_prod
        run: ./scripts/smoke-test.sh "${{ vars.APP_URL }}"

      - name: Roll back traffic
        if: failure() && steps.smoke_prod.outcome == 'failure'
        run: ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh switch"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production"
            echo "- Image: \`$IMAGE_TAG\`"
            echo "- Duyệt bởi: xem tab Environments → production"
            echo '```'
            ssh $SSH_OPTS "$REMOTE" "bash /opt/wallet/production/bluegreen.sh status" 2>&1 | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
