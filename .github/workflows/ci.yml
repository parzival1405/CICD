name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show versions
        run: ./mvnw -v

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wallet-service-jar-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Kết quả build"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Event: ${{ github.event_name }}"
            echo ""
            echo "### Tests"
            echo '```'
            cat target/surefire-reports/*.txt target/failsafe-reports/*.txt 2>/dev/null \
              | grep -E 'Tests run:' || echo "Không tìm thấy báo cáo test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
