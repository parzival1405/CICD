name: Cache demo

on:
  push:
    branches: [ci/cache-secrets]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        id: m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-demo-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-demo-${{ runner.os }}-

      - name: Cache hit?
        run: echo "cache-hit = ${{ steps.m2.outputs.cache-hit }}"

      - name: Resolve dependencies
        run: ./mvnw -B -ntp dependency:go-offline -q
