name: Secrets demo

on:
  push:
    branches: [ci/cache-secrets]

permissions:
  contents: read

jobs:
  demo2:
    runs-on: ubuntu-latest
    steps:
      - name: Dung variable
        run: |
            echo "Moi truong: ${{ vars.APP_ENV_NAME }}"

      - name: Dung secret qua bien moi truong
        env:
          API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          echo "Secret in thang (se bi che): $API_TOKEN"
          echo "Do dai token: ${#API_TOKEN}"
          if [[ -z "$API_TOKEN" ]]; then
            echo "Thieu secret DEMO_API_TOKEN" >&2
            exit 1
          fi
          echo "Goi API gia lap voi token..."
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $API_TOKEN" https://httpbin.org/bearer

      - name: Secret khong ton tai
        run: |
            echo "Gia tri: [${{ secrets.KHONG_CO }}]"
